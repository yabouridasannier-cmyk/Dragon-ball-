<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060F">
<title>Invocation Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f5a623'/%3E%3Ccircle cx='23' cy='21' r='9' fill='%23fff1c0' opacity='.7'/%3E%3Cpath d='M32 24l3 7h8l-6 5 2 8-7-4-7 4 2-8-6-5h8z' fill='%23c0281a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="mb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="mbBlur" stdDeviation="0 0"/></filter>
</svg>

<div id="stars" aria-hidden="true"></div>

<main id="stage">
  <header>
    <div class="logo">INVOCATION <b>Z</b></div>
    <nav id="chips" aria-label="Joueur qui invoque"></nav>
    <div class="tools">
      <button id="btn-log" class="tool" title="Journal des combats" aria-label="Journal des combats">📜<b id="logBadge" hidden></b></button>
      <button id="btn-mus" class="tool" title="Musique" aria-pressed="true">♫</button>
      <button id="btn-snd" class="tool" title="Sons" aria-pressed="true">♪</button>
      <button id="btn-gear" class="tool" title="Réglages">⚙</button>
    </div>
  </header>

  <div id="panel" hidden>
    <div class="row"><span>Durée du spectacle</span><div id="profiles"></div></div>
    <div class="row"><span>Intro Shenron</span><button id="btn-intro" class="pill" aria-pressed="true">Activée</button></div>
    <div class="row"><span>Mode calme</span><button id="btn-calm" class="pill" aria-pressed="false">Désactivé</button></div>
    <div class="row"><span>Journal des combats</span><button id="btn-log2" class="pill">Ouvrir</button></div>
    <div class="row"><span>Decks (propriétaires)</span><button id="btn-decks" class="pill">Réinitialiser</button></div>
  </div>

  <div id="balls" aria-hidden="true"></div>

  <section id="machine">
    <div class="bulbs top" id="bulbsTop"></div>
    <div id="window">
      <div id="light"></div>
      <div id="strip"></div>
      <div class="edge l"></div><div class="edge r"></div>
      <div class="ptr top"></div><div class="ptr bot"></div>
      <div id="streaks"></div>
      <div id="lockbox"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="bulbs bot" id="bulbsBot"></div>
  </section>

  <div id="info">
    <div class="count"><span id="count">239</span> <small>/ 239 cartes en jeu</small></div>
    <div class="odds" id="odds">Choisis qui invoque</div>
  </div>

  <button id="go" disabled aria-label="Invocation"><span class="orb"><em></em><em></em><em></em><em></em></span><span class="lbl">INVOCATION</span></button>

  <div id="histHint" aria-live="polite"></div>
  <div id="history" aria-label="Cartes tirées : touche une carte pour valider le combat"></div>
</main>

<div id="vignette"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="overlay" hidden>
  <div id="rays"></div>
  <div id="heroWrap"></div>
  <div id="banner"><div class="nm" id="bnName"></div><div class="ow" id="bnOwner"></div></div>
  <div id="actions"><button id="again" class="cta">Nouvelle invocation</button><button id="undo" class="ghost">Annuler ce tirage</button></div>
</div>

<div id="shenron" hidden aria-hidden="true">
  <canvas id="shn"></canvas>
  <div id="shnCap"></div>
  <div id="shnSkip">Touche pour passer</div>
</div>

<div id="journal" hidden role="dialog" aria-modal="true" aria-labelledby="jTitle">
  <div class="sheet">
    <div class="jhead"><h2 id="jTitle">📜 Journal des combats</h2><button id="jClose" class="x" aria-label="Fermer">✕</button></div>
    <div id="jDecks" class="jdecks"></div>
    <div class="jtools">
      <div id="jFilter" class="seg" role="group" aria-label="Filtrer par résultat">
        <button type="button" data-f="all" aria-pressed="true">Tous <i></i></button>
        <button type="button" data-f="pending" aria-pressed="false">⚔ À jouer <i></i></button>
        <button type="button" data-f="won" aria-pressed="false">✔ Gagnés <i></i></button>
        <button type="button" data-f="lost" aria-pressed="false">✘ Perdus <i></i></button>
        <button type="button" data-f="void" aria-pressed="false">∅ Annulés <i></i></button>
      </div>
      <input id="jSearch" type="search" placeholder="Chercher une carte…" aria-label="Chercher une carte" autocomplete="off">
    </div>
    <div id="jList" class="jlist"></div>
    <details id="jAdd" class="jadd">
      <summary>➕ Ajouter ou corriger un combat à la main</summary>
      <div class="jform">
        <label>Qui a tiré <select id="jWho"></select></label>
        <label>Carte <input id="jCardQ" list="jCards" placeholder="Nom de la carte" autocomplete="off"></label>
        <datalist id="jCards"></datalist>
        <label>Résultat <select id="jRes"><option value="won">Gagné</option><option value="lost">Perdu</option><option value="pending">À jouer</option></select></label>
        <button id="jAddBtn" type="button" class="pill">Ajouter</button>
        <p id="jAddMsg" aria-live="polite"></p>
      </div>
    </details>
    <div id="jIO" hidden><textarea id="jText" rows="5" spellcheck="false" aria-label="Sauvegarde du journal"></textarea><button id="jApply" type="button" class="pill">Restaurer</button></div>
    <div class="jfoot">
      <button id="jNewSession" type="button" class="pill">Nouvelle session</button>
      <button id="jExport" type="button" class="pill">Copier la sauvegarde</button>
      <button id="jImport" type="button" class="pill">Restaurer…</button>
      <span id="jMode"></span>
    </div>
  </div>
</div>

<div id="duel" hidden role="dialog" aria-modal="true" aria-labelledby="duelTitle">
  <div class="box">
    <button id="duelClose" class="x" aria-label="Fermer">✕</button>
    <div id="duelCard"></div>
    <h2 id="duelTitle"></h2>
    <p id="duelInfo"></p>
    <p id="duelState"></p>
    <div class="btns">
      <button id="duelWin" class="cta win"></button>
      <button id="duelLose" class="cta lose"></button>
    </div>
    <button id="duelReset" class="ghost" hidden>Remettre le combat à jouer</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="demo" hidden>VERSION DE TEST · cartes provisoires</div>

<script type="module" src="app.js"></script>
</body>
</html>
